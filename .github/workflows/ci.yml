name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: surv
          POSTGRES_PASSWORD: surv
          POSTGRES_DB: surv_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U surv" --health-interval 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://surv:surv@localhost:5432/surv_test
      SURV_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: models/requirements.txt
      - run: pip install -r models/requirements.txt
      - run: npm ci
      - run: npm run typecheck
      - name: Python model tests
        working-directory: models
        run: python -m pytest -q tests
      - name: TypeScript tests (real Postgres, Python worker)
        run: npx vitest run

  compose-smoke:
    runs-on: ubuntu-latest
    needs: test
    env:
      SURV_ACCOUNTS: "1000"
      SURV_DAYS: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bring up the stack (seeds and replays on first start)
        run: docker compose up -d --build --wait
      - run: scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
