name: surveillance

x-app: &app
  build: .
  image: linked-account-surveillance-engine:local
  environment:
    DATABASE_URL: postgres://surv:surv@db:5432/surv
    SURV_REPORT_LLM: ${SURV_REPORT_LLM:-scripted}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    SURV_ACCOUNTS: ${SURV_ACCOUNTS:-3000}
    SURV_DAYS: ${SURV_DAYS:-14}
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: surv
      POSTGRES_PASSWORD: surv
      POSTGRES_DB: surv
    ports:
      - "${POSTGRES_PORT:-5556}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surv -d surv"]
      interval: 3s
      retries: 30

  # Seeds the synthetic history and replays it through the whole system on first
  # start (a few minutes), then runs as the live stream consumer.
  engine:
    <<: *app
    command: ["sh", "-c", "node dist/cli.js bootstrap && exec node dist/cli.js engine"]
    environment:
      DATABASE_URL: postgres://surv:surv@db:5432/surv
      SURV_REPORT_LLM: ${SURV_REPORT_LLM:-scripted}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SURV_ACCOUNTS: ${SURV_ACCOUNTS:-3000}
      SURV_DAYS: ${SURV_DAYS:-14}
      SURV_READY_FILE: /tmp/ready
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      start_period: 900s
      retries: 3

  # Today's events from the same synthetic world, as wall-clock time reaches them,
  # plus index ticks four times a second per contract.
  live:
    <<: *app
    command: ["node", "dist/cli.js", "live"]
    depends_on:
      engine:
        condition: service_healthy

  # Linker every 5 minutes, co-activity every 15, verdicts every 10, the nightly
  # sequence (audit, scorecard, shadow decision, refit, threshold, report) at 06:00 UTC.
  scheduler:
    <<: *app
    command: ["node", "dist/cli.js", "scheduler"]
    depends_on:
      engine:
        condition: service_healthy

  api:
    <<: *app
    command: ["node", "dist/cli.js", "api", "--port", "8080"]
    ports:
      - "${API_PORT:-8270}:8080"
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health > /dev/null"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
